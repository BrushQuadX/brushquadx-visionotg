[package]
name = "VisionOTG"
version = "1.0.0"
edition = "2024"
authors = ["John Santos johnmarisantos@protonmail.com"]
description = "FPV Camera with AI inference"
license = "CC-BY-4.0"
repository = "https://github.com/BrushQuadX/brushquadx-visionotg"
homepage = "https://www.johnmvsantos.com/html_projects/arduino_drone"
readme = "../README.md"
keywords = ["fpv", "camera", "drone", "ai", "yolo", "inference"]
categories = ["computer-vision"]

[[bin]]
name = "votg"
path = "src/votg.rs"

[dependencies]
gstreamer = "0.25.2"
gstreamer-video = "0.25.2"
gstreamer-app = "0.25.2"
ndarray = "0.17.2"
serde_json = "1.0.151"
eframe = { version = "0.36.1", features = ["default", "glow"] }
egui_extras = { version = "0.36.1", features = ["default", "image"] }
egui_alignments = "0.3.9"
env_logger = "0.11.11"

[target.'cfg(not(target_arch = "aarch64"))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }

[target.aarch64-unknown-linux-gnu.dependencies]
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "ndarray"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
debug = false

[profile.profiling]
inherits = "release"
strip = false
debug = true
