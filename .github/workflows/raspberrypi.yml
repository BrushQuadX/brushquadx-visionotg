name: Raspberry Pi package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build ARM64 Debian package
        shell: bash
        run: |
          chmod +x packaging/linux/*.sh packaging/linux/visionotg-launcher
          packaging/linux/build_deb.sh --setup

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: visionotg-linux-arm64
          path: target/linux-packages/*.deb
          if-no-files-found: error

      - name: Create Linux release archive
        shell: bash
        run: |
          mkdir -p target/release-assets
          zip -j target/release-assets/visionotg-linux-arm64.zip target/linux-packages/*.deb

      - name: Attach Linux installer to tag release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-assets/visionotg-linux-arm64.zip
